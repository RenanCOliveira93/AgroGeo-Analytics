[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agrogeo"
version = "0.1.0"
description = "AgroGeo Analytics: geospatial data science applied to agriculture (coffee, Piraju/SP)"
requires-python = ">=3.10"
dependencies = [
  "numpy", "pandas", "geopandas", "shapely>=2", "pyproj", "rasterio",
  "matplotlib", "folium", "scipy", "python-dotenv",
]

[project.optional-dependencies]
ee = ["earthengine-api", "geemap"]
dev = ["pytest", "nbformat", "nbclient", "ipykernel"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
